apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-gitops
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-gitops
  template:
    metadata:
      labels:
        app: hello-gitops
    spec:
      containers:
      - name: hello-gitops
        image: nginx:alpine
        ports:
        - containerPort: 80
